[project]
name = "xdr-cli"
version = "0.1.0"
description = "Pilot Cortex XDR from the command-line"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
 "click",
 "xlsxwriter",
 "requests",
 "httpx"
]

[project.optional-dependencies]
slack = [
 "slack-bolt"
]

[project.scripts]
xdr-cli = "xdr_cli.xdr_cli:cli"
