[project]
name = "xdr-cli"
version = "0.1.0"
description = "Pilot Cortex XDR from the command-line"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
 "click",
 "xlsxwriter",
 "httpx"
]

[project.optional-dependencies]
slack = [
 "slack-bolt",
 "aiohttp"
]
mcp = [
 "mcp; python_version >= '3.10'"
]

[project.scripts]
xdr-cli = "xdr_cli.xdr_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xdr_cli"]

[dependency-groups]
dev = ["pytest"]
